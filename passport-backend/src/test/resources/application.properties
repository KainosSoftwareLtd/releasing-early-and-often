# Disable Flyway migrations for tests. In production, Exercise-2 runs the V2 migration
# to add parent columns. In tests, we bypass migrations entirely and let Hibernate create
# the schema directly from the entity, which already declares those fields.
spring.flyway.enabled=false

# Let Hibernate derive the full schema from the entity classes at test startup and drop it
# on teardown. This ensures all entity fields (including parent columns added in Exercise-3)
# are present in H2, without needing the V2 Flyway migration from Exercise-2.
spring.jpa.hibernate.ddl-auto=create-drop

# Feature flag - enables the V2 child renewals endpoint. Set to true in tests so the
# full endpoint behaviour can be exercised. In production this is controlled via application.properties.
feature.child-renewals.enabled=true

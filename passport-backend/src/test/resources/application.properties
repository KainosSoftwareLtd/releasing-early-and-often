# This test properties file exists so Exercise 3 integration tests can run without needing
# the V2 Flyway migration from Exercise 2. Flyway runs the V1 migration as normal, then
# Hibernate update adds the missing parent columns that Exercise 2 would normally provide.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=update

feature.child-renewals.enabled=true
